name: rex_school_erp_flutter
description: "Rex Senior Secondary School ERP & School Bus GPS Tracker"
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/rex_emblem.png
    - assets/rex_banner_white.png

name: Build Rex School ERP APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create Flutter scaffold (fill in missing generated files)
        run: |
          flutter create --project-name rex_school_erp_flutter --org com.rex.school --platforms android . --no-overwrite || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (non-fatal)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK (release)
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=FLUTTER_WEB_AUTO_DETECT=true \
            2>&1 | tee build_log.txt || true
          
          # Also try debug if release fails
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "Release build failed, trying debug..."
            flutter build apk --debug --no-tree-shake-icons 2>&1 | tee build_log_debug.txt
          fi

      - name: Check APK output
        run: |
          echo "=== Build outputs ==="
          find build/app/outputs -name "*.apk" 2>/dev/null || echo "No APK found in standard location"
          ls -lh build/app/outputs/flutter-apk/ 2>/dev/null || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rex-school-erp-v2-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
            build_log.txt
            build_log_debug.txt
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-${{ github.run_number }}
          name: "Rex School ERP v2.0 - Complete Feature Release"
          body: |
            ## Rex Senior Secondary School ERP v2.0
            
            ### ✅ New Features (22 Screens)
            - 🏠 Redesigned Home with Feature Grid + Message Feed
            - 📋 Notice Board with categories & pinned notices
            - 👥 Staff Room (72 staff) with contact directory  
            - 📅 Full Timetable with day-wise color-coded view
            - 🎓 Admission Management (Enquiry → Application → Admitted)
            - 📹 Live Class (Live/Upcoming/Recorded sessions)
            - 📝 Assignments with submission tracking
            - 📖 Class Diary with daily homework entries
            - 📚 Content Library (PDF & Video resources)
            - 📊 Evaluation with exam schedules & results
            - 🏛️ Virtual Office (TC, Bonafide, Certificates, Complaints)
            - 👨‍👩‍👧‍👦 School Strength (1010 students, gender ratio)
            - 🖼️ Lounge Media Gallery
            - 🗓️ School Calendar with events
            - 📞 Contact Directory with availability
            - 💬 Feedback with star rating
            - 💬 Message Center (Birthday/Absent/Greeting alerts)
            - 🚌 Bus GPS Tracker with 500m proximity alert
            - 📄 CBSE Report Card
            - 💰 Fee Management & Analysis
            - ✅ Attendance Register
            - 🏖️ Leave Desk
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

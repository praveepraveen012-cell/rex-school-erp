name: Build Rex School ERP APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate complete Android scaffold with Rex branding
        run: |
          # 1. Backup AndroidManifest and complete res/ (styles, drawable, mipmaps)
          mkdir -p /tmp/rex_backup
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/rex_backup/
          fi
          if [ -d "android/app/src/main/res" ]; then
            cp -r android/app/src/main/res /tmp/rex_backup/
          fi

          # 2. Re-create android platform cleanly so gradlew, wrapper jar, and Gradle 8 files are generated
          rm -rf android
          flutter create --project-name rex_school_erp_flutter \
            --org com.rex.school \
            --platforms android \
            .

          # 3. Restore all custom res (styles.xml, launch_background.xml, mipmap launcher icons)
          if [ -d "/tmp/rex_backup/res" ]; then
            cp -r /tmp/rex_backup/res/* android/app/src/main/res/ 2>/dev/null || true
          fi

          # 4. Make gradlew executable
          chmod +x android/gradlew

          # 5. Restore custom AndroidManifest
          if [ -f "/tmp/rex_backup/AndroidManifest.xml" ]; then
            cp /tmp/rex_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          # 6. Ensure app label is Rex Management App and launcher icons are linked
          sed -i 's/android:label="[^"]*"/android:label="Rex Management App"/' android/app/src/main/AndroidManifest.xml
          if ! grep -q "android:roundIcon" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher_round"/' android/app/src/main/AndroidManifest.xml
          fi

          # 7. Ensure network, location, and vibration permissions exist in AndroidManifest
          if ! grep -q "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>' android/app/src/main/AndroidManifest.xml
          fi

          # 8. Configure release build to use debug signing key so APK can be installed immediately
          sed -i 's/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/g' android/app/build.gradle || true
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

          # 9. Verify generated wrapper files and styles exist
          echo "=== Android files verified ==="
          ls -la android/gradlew
          ls -la android/gradle/wrapper/
          ls -la android/app/src/main/res/values/
          ls -la android/app/src/main/res/mipmap-hdpi/

      - name: Install dependencies
        run: flutter pub get

      - name: Check code
        run: flutter analyze 2>&1 || true

      - name: Build Release APK
        run: |
          echo "Starting Flutter release APK build..."
          flutter build apk --release --no-tree-shake-icons --verbose > build.log 2>&1 || (cat build.log | grep -A 10 -B 3 -i "error\|exception" | head -n 80 && tail -n 80 build.log && exit 1)
          echo "=== APK files built successfully ==="
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload Build Log on Failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: "Build Log ${{ github.run_number }}"
          body: "Debugging build log"
          files: build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp build/app/outputs/flutter-apk/app-release.apk release-apk/RexManagementApp-v2.0.apk
          echo "=== Prepared APK for release ==="
          ls -lh release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RexManagementApp-v2.0-APK
          path: release-apk/RexManagementApp-v2.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "📱 Rex Management App v2.0 (Build ${{ github.run_number }})"
          body: |
            ## 📱 Rex Management App v2.0
            
            **Christus Rex Senior Secondary School, Ootacamund, Nilgiris**
            *(Catholic Diocese of Ootacamund • CBSE Affiliation)*
            
            ---
            
            ### ⬇️ Download the App:
            Tap **`RexManagementApp-v2.0.apk`** below under the **Assets** section.
            
            > 💡 **Quick Installation Guide:**
            > 1. Download `RexManagementApp-v2.0.apk` onto your phone.
            > 2. Open the downloaded file from notifications or your Downloads folder.
            > 3. When asked, choose **"Allow from this source"** or enable unknown apps for your browser.
            > 4. Tap **Install** and launch **Rex Management App**!
            
            ---
            
            ### ✨ What's New in this Release:
            - 🏷️ **App Name Updated**: Officially titled **Rex Management App**
            - 🏫 **Official School App Icon**: Rex School gold emblem launcher icon on pure white
            - 🎨 **White Background Header**: Crisp, high-contrast white logo container on home dashboard
            - 🏠 **Split-Screen Dashboard**: Feature Grid + Live Message Center Feed
            - 📋 **Notice Board**: Categorized announcements with search & pin
            - 👥 **Staff Room**: Directory of 72 teachers with one-tap Call/Email
            - 📅 **Day-wise Timetable**: Interactive periods Monday to Friday
            - 🎓 **Admission Portal**: Enquiries, applications, and admitted students
            - 📹 **Live Class Center**: Live, upcoming, and recorded study sessions
            - 📝 **Assignment Desk**: Subject tasks and submission statuses
            - 📖 **Class Diary**: Daily homework logs by date
            - 📚 **Content Library**: Study material PDFs and curated videos
            - 📊 **Evaluation & Results**: CBSE marks, grades, and report cards
            - 🏛️ **Virtual Office**: Online requests for TC, Bonafide, Certificates
            - 👨‍👩‍👧‍👦 **School Strength**: 1,010 students statistical overview
            - 🖼️ **Lounge**: Campus life and event photo gallery
            - 🗓️ **Academic Calendar**: Month-by-month school calendar
            - 📞 **Contact Directory**: Complete staff and department contacts
            - 💬 **Feedback Desk**: Star ratings and suggestions
            - 🔔 **Message Center**: Official school announcements & notices
            - 🚌 **Bus GPS Tracker**: Real-time school bus tracking with 500m alert
            - 📄 **CBSE Digital Report Card**: Term exams, scholastic & co-scholastic grades
            - 💰 **Fee Management**: Detailed term breakdown & online payment records
            - ✅ **Digital Attendance**: Daily attendance percentage & leave logs
            - 🏖️ **Leave Desk**: Easy online leave applications
          files: release-apk/RexManagementApp-v2.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

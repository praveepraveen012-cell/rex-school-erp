name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Universal Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Native Platform Scaffold
        working-directory: ./flutter_app
        run: |
          flutter create --platforms=android --org com.rex .
          flutter pub get

      - name: Build Android Release APK
        working-directory: ./flutter_app
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons > ../build.log 2>&1
          BUILD_EXIT_CODE=$?
          tail -n 80 ../build.log
          exit $BUILD_EXIT_CODE

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build.log

      - name: Upload Single APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rex-School-ERP-Android-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "Rex Senior Secondary School ERP - Android APK (v1.0.0)"
          body: |
            ### 📱 Rex Senior Secondary School ERP - Mobile Android APK

            Download and install this single APK file on your Android mobile device for testing:
            - **File**: `app-release.apk`
            - **Platform**: Android 5.0+ (Lollipop to Android 15)
            - **Features Included**:
              - Live GPS Bus Tracker (4 Nilgiris Routes)
              - 500m Geofencing Alarm with audio chime and WhatsApp alert copy
              - Official Digital Student ID & Gate Pass with scannable QR Code
              - Smart Attendance Register & Fee Cashier
              - Digital Homework Diary & Student Leave Desk
              - CBSE Grade 10 Marksheet

            #### Installation Instructions:
            1. Download `app-release.apk` on your Android phone.
            2. Tap the downloaded file to install (Enable *"Install from Unknown Sources"* if prompted).
            3. Open **Rex SSS ERP** from your app drawer!
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

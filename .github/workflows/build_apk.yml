name: Build Grexotix School Management Platform APK

on:
  push:
    branches: [main, feature/ios-android-crossplatform]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate complete Android scaffold with Grexotix branding
        run: |
          # 1. Backup AndroidManifest and complete res/ (styles, drawable, mipmaps)
          mkdir -p /tmp/rex_backup
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/rex_backup/
          fi
          if [ -d "android/app/src/main/res" ]; then
            cp -r android/app/src/main/res /tmp/rex_backup/
          fi

          # 2. Re-create android platform cleanly so gradlew, wrapper jar, and Gradle 8 files are generated
          rm -rf android
          flutter create --project-name rex_school_erp_flutter \
            --org com.rex.school \
            --platforms android \
            .

          # 3. Upgrade Kotlin version to 1.9.24 to match modern AndroidX dependencies
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/org\.jetbrains\.kotlin\.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle || true
            sed -i 's/version "1.7.10"/version "1.9.24"/g' android/settings.gradle || true
            sed -i 's/version "1.7.20"/version "1.9.24"/g' android/settings.gradle || true
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i 's/ext\.kotlin_version = .*/ext.kotlin_version = "1.9.24"/g' android/build.gradle || true
            sed -i 's/kotlin_version = .*/kotlin_version = "1.9.24"/g' android/build.gradle || true
          fi

          # 4. Restore all custom res (styles.xml, launch_background.xml, mipmap launcher icons)
          if [ -d "/tmp/rex_backup/res" ]; then
            cp -r /tmp/rex_backup/res/* android/app/src/main/res/ 2>/dev/null || true
          fi

          # 4. Make gradlew executable
          chmod +x android/gradlew

          # 5. Restore custom AndroidManifest
          if [ -f "/tmp/rex_backup/AndroidManifest.xml" ]; then
            cp /tmp/rex_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          # 6. Ensure app label is Grexotix School ERP and launcher icons are linked
          sed -i 's/android:label="[^"]*"/android:label="Grexotix School ERP"/' android/app/src/main/AndroidManifest.xml
          if ! grep -q "android:roundIcon" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher_round"/' android/app/src/main/AndroidManifest.xml
          fi

          # 7. Ensure network, location, and vibration permissions exist in AndroidManifest
          if ! grep -q "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>' android/app/src/main/AndroidManifest.xml
          fi

          # 8. Configure release build to use debug signing key so APK can be installed immediately
          sed -i 's/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/g' android/app/build.gradle || true
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

          # 8b. Ensure Google Maps SDK API key meta-data exists in AndroidManifest
          if ! grep -q "com.google.android.geo.API_KEY" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.geo.API_KEY" android:value="AIzaSyRexManagementDemoAndroidKey7788"/>' android/app/src/main/AndroidManifest.xml || true
          fi

          # 9. Verify generated wrapper files and styles exist
          echo "=== Android files verified ==="
          ls -la android/gradlew
          ls -la android/gradle/wrapper/
          ls -la android/app/src/main/res/values/
          ls -la android/app/src/main/res/mipmap-hdpi/

      - name: Install dependencies
        run: flutter pub get

      - name: Check code
        run: flutter analyze 2>&1 || true

      - name: Build Release APK
        run: |
          echo "Starting Flutter release APK build..."
          flutter build apk --release --no-tree-shake-icons --verbose > build.log 2>&1 || (cat build.log | grep -A 10 -B 3 -i "error\|exception" | head -n 80 && tail -n 80 build.log && exit 1)
          echo "=== APK files built successfully ==="
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload Build Log on Failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: "Build Log ${{ github.run_number }}"
          body: "Debugging build log"
          files: build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp build/app/outputs/flutter-apk/app-release.apk release-apk/GrexotixSchoolManagement-v2.5.apk
          echo "=== Prepared APK for release ==="
          ls -lh release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrexotixSchoolManagement-v2.5-APK
          path: release-apk/GrexotixSchoolManagement-v2.5.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.${{ github.run_number }}
          name: "📱 Grexotix School Management Platform (Build ${{ github.run_number }})"
          body: |
            ## 📱 Grexotix School Management Platform v2.5
            
            **Empowering Schools with Smart Management**
            *(Product of Grexotix • Multi-School Sovereign SaaS Operating System)*
            
            ---
            
            ### ⬇️ Download the App:
            Tap **`GrexotixSchoolManagement-v2.5.apk`** below under the **Assets** section.
            
            > 💡 **Quick Installation Guide:**
            > 1. Download `GrexotixSchoolManagement-v2.5.apk` onto your phone.
            > 2. Open the downloaded file from notifications or your Downloads folder.
            > 3. When asked, choose **"Allow from this source"** or enable unknown apps for your browser.
            > 4. Tap **Install** and launch **Grexotix School Management Platform**!
            
            ---
            
            ### ✨ What's New in this Release:
            - 🏷️ **Grexotix Multi-Tenant Platform**: Complete SaaS rebrand with official Grexotix emblem
            - 🏫 **Pure White Logo Standard**: Pristine `#FFFFFF` logo presentation with original aspect ratios
            - 🆔 **Digital Student ID & Gate Pass**: Dynamic scannable QR payload (`GRX-STU:`) with multi-child switcher
            - 🔒 **Parent Homework Restriction**: Strict security boundary forbidding parents from homework management
            - 💳 **30% Minimum Split-Payment**: Enforcement on tuition fees with real-time outstanding ledger
            - 🚌 **Fleet GPS Tracking & Telemetry**: Live transit monitoring with 500m proximity alerts
            - 👥 **Campus Operations**: HR payroll, staff attendance, library catalog, visitor logging
          files: release-apk/GrexotixSchoolManagement-v2.5.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

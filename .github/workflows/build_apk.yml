name: Build Rex School ERP APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create Flutter scaffold for missing platform files
        run: |
          flutter create --project-name rex_school_erp_flutter \
            --org com.rex.school \
            --platforms android \
            . \
            2>&1 || true
          echo "Scaffold done"

      - name: Install dependencies
        run: flutter pub get

      - name: Check for compile errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 || true

      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --target-platform android-arm,android-arm64,android-x64 \
            --split-per-abi \
            2>&1
          echo "=== APK files built ==="
          find build/app/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Rename APK for easy download
        run: |
          mkdir -p apk-output
          # Copy all APKs
          find build/app/outputs/flutter-apk -name "*.apk" -exec cp {} apk-output/ \;
          # Also create a universal copy if split ones exist
          ls -lh apk-output/
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rex-school-erp-v2-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "📱 Rex School ERP v2.0 - Complete App (Build ${{ github.run_number }})"
          body: |
            ## 📱 Rex Senior Secondary School ERP v2.0
            
            ### ⬇️ Download the APK below (under Assets section)
            
            > **Install:** Download the APK → Allow unknown sources on phone → Install
            
            ### ✅ 22 Screens in this release:
            🏠 Home | 📋 Notice Board | 👥 Staff Room | 📅 Timetable
            🎓 Admission | 📹 Live Class | 📝 Assignments | 📖 Class Diary
            📚 Content Library | 📊 Evaluation | 🏛️ Virtual Office
            👨‍👩‍👧‍👦 School Strength (1010) | 🖼️ Lounge Gallery | 🗓️ Calendar
            📞 Contact Directory | 💬 Feedback | 💬 Messages
            🚌 Bus GPS Tracker (500m alert) | 📄 CBSE Report Card
            💰 Fee Management | ✅ Attendance | 🏖️ Leave Desk
          files: apk-output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
